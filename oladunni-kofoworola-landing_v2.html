  <style>
    :root {
      --background: oklch(0.16 0.03 280);
      --foreground: oklch(0.97 0.01 280);
      --primary: oklch(0.51 0.23 277);
      --primary-foreground: oklch(0.98 0.005 280);
      --muted-foreground: oklch(0.72 0.03 280);
      --overlay: linear-gradient(100deg, oklch(0.16 0.03 280 / 94%) 0%, oklch(0.16 0.03 280 / 70%) 45%, oklch(0.16 0.03 280 / 25%) 100%);
      --shadow-glow: 0 10px 40px -10px oklch(0.51 0.23 277 / 65%);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--foreground); font-family: Cabin, sans-serif; letter-spacing: 0; }
    a { color: inherit; text-decoration: none; }
    .page { position: relative; min-height: 100vh; overflow: hidden; }
    .background, .overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
    .background { object-fit: cover; }
    .overlay { background: var(--overlay); }
    .header { position: relative; z-index: 1; max-width: 1152px; margin: auto; padding: 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { font-family: 'Abril Fatface', serif; font-size: 24px; line-height: 32px; }
    .brand em { font-style: normal; color: var(--primary); }
    .nav { display: none; gap: 32px; font-size: 14px; color: var(--muted-foreground); }
    .nav a:hover { color: var(--foreground); }
    .hero { position: relative; z-index: 1; margin: auto; max-width: 1152px; min-height: calc(100vh - 88px); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); padding: 0 24px 96px; }
    .content { grid-column: span 12; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .eyebrow { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .accent-line { width: 40px; height: 1px; background: var(--primary); }
    .eyebrow p { margin: 0; color: var(--primary); font-size: 12px; line-height: 16px; text-transform: uppercase; }
    h1 { margin: 0; font-family: 'Abril Fatface', serif; font-size: 60px; line-height: 0.95; font-weight: 400; overflow-wrap: anywhere; }
    h1 em { color: var(--primary); }
    .subtitle { margin: 32px 0 0; max-width: 576px; font-size: 18px; line-height: 28px; color: var(--muted-foreground); }
    .actions { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 16px; }
    .projects-button { display: inline-block; max-width: 100%; border-radius: 999px; padding: 16px 32px; background: var(--primary); color: var(--primary-foreground); box-shadow: var(--shadow-glow); font-size: 14px; line-height: 20px; font-weight: 500; transition: opacity 150ms; text-align: center; }
    .projects-button:hover { opacity: 0.9; }
    a:focus-visible { outline: 2px solid var(--foreground); outline-offset: 5px; }
    .caption { display: none; position: absolute; right: 0; top: 50%; margin: 0; transform: translateY(-50%) rotate(90deg); font-size: 10.4px; text-transform: uppercase; color: var(--muted-foreground); opacity: 0.7; }
    @media (min-width: 640px) { .nav { display: flex; } .content { grid-column: span 8; } h1 { font-size: 72px; } }
    @media (min-width: 1024px) { .content { grid-column: span 7; } h1 { font-size: 96px; } .caption { display: block; } }
    @media (prefers-reduced-motion: reduce) { .projects-button { transition: none; } }
  </style>
</head>
